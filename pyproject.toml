[project]
name = "solo-jupyter-environment"
version = "0.2.1"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jupyterlab==4.6.4",
    "notebook==7.6.3",
    "jupyter-lsp==2.3.1",
    "jupyterlab-lsp==5.3.0",
    "jupyterlab-language-pack-zh-CN==4.5.post3",
    "jupyter-ruff==0.3.1",
    "jupyter-resource-usage==1.3.0",
    "jupyterlab-spreadsheet==0.4.2",
    "python-lsp-server==1.15.0",
    "python-lsp-ruff==2.3.3",
    "ruff==0.16.6",
    "jupyter-server-mcp==0.3.0",
    "jupyterlab-commands-toolkit==0.2.0",
    "dolphindb-extension[notebook]==0.1.0b3",
    "dolphindb==3.0.6.0",
    "future==1.0.0",
    "jupyterlab-execute-time==3.3.0",
    "uv==0.12.10",
    "tomlkit>=0.13,<1",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
