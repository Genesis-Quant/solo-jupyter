name: jupyter

services:
  jupyter:
    build:
      context: .
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:7891
        HTTPS_PROXY: http://127.0.0.1:7891
        http_proxy: http://127.0.0.1:7891
        https_proxy: http://127.0.0.1:7891
    container_name: jupyter
    restart: unless-stopped
    user: root
    working_dir: /home/jovyan/work
    command:
      - start-jupyter.sh
      - --ServerApp.root_dir=/home/jovyan/work
      - --ServerApp.default_url=/lab
    mem_limit: 4096m
    memswap_limit: 4096m
    environment:
      NB_UID: "1000"
      NB_GID: "100"
      CHOWN_HOME: "yes"
      CHOWN_HOME_OPTS: "-R"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in .env}
      HTTP_PROXY: http://metacubexd:7891
      HTTPS_PROXY: http://metacubexd:7891
      ALL_PROXY: http://metacubexd:7891
      NO_PROXY: localhost,127.0.0.1,::1,jupyter,metacubexd
      http_proxy: http://metacubexd:7891
      https_proxy: http://metacubexd:7891
      all_proxy: http://metacubexd:7891
      no_proxy: localhost,127.0.0.1,::1,jupyter,metacubexd
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./data:/home/jovyan/work
      - ./config:/home/jovyan/.jupyter
      - ./keyring-data:/home/jovyan/.local/share/keyrings
      - codex-home:/home/jovyan/.codex
      - ./config/nbconvert/templates/latex:/home/jovyan/.local/share/jupyter/nbconvert/templates/latex
      - ./ipython_config.py:/etc/ipython/ipython_config.py:ro
    secrets:
      - jupyter-keyring-password
    networks:
      - 1panel-network

volumes:
  codex-home:

secrets:
  jupyter-keyring-password:
    file: ./secrets/jupyter-keyring-password

networks:
  1panel-network:
    external: true
