name: jupyter

services:
  jupyter:
    build:
      context: .
    container_name: jupyter
    restart: unless-stopped
    networks:
      - default${SOLO_DOCKER_NETWORK:+_external}
    user: root
    working_dir: /home/jovyan/work
    command:
      - bash
      - -ec
      - |
        exec dbus-run-session -- bash -euc '
          printf "%s" "$$JUPYTER_KEYRING_PASSWORD" |
            gnome-keyring-daemon --unlock --components=secrets --daemonize >/dev/null
          export PYTHON_KEYRING_BACKEND=keyring.backends.SecretService.Keyring
          unset JUPYTER_KEYRING_PASSWORD
          python -B -c "import secretstorage, sys; sys.exit(secretstorage.get_default_collection(secretstorage.dbus_init()).is_locked())"
          exec start-notebook.py --ServerApp.root_dir=/home/jovyan/work --ServerApp.default_url=/lab
        '
    environment:
      CHOWN_HOME: "yes"
      CHOWN_HOME_OPTS: "-R"
      CHOWN_EXTRA: /shared/skills
      CHOWN_EXTRA_OPTS: ""
      SOLO_SHARED_DIR: /home/jovyan/work
      UV_CACHE_DIR: /home/jovyan/work/.uv-cache
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in .env}
      JUPYTER_KEYRING_PASSWORD: ${JUPYTER_KEYRING_PASSWORD:?Set JUPYTER_KEYRING_PASSWORD in .env}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:?Set TUSHARE_TOKEN in .env}
      SOLO_DOLPHIN_HOST: ${SOLO_DOLPHIN_HOST:-dolphindb}
      SOLO_DOLPHIN_PORT: ${SOLO_DOLPHIN_PORT:-8848}
      SOLO_DOLPHIN_USERNAME: ${SOLO_DOLPHIN_USERNAME:?Set SOLO_DOLPHIN_USERNAME in .env}
      SOLO_DOLPHIN_PASSWORD: ${SOLO_DOLPHIN_PASSWORD:?Set SOLO_DOLPHIN_PASSWORD in .env}
      BACKTEST_DOLPHIN_HOST: ${BACKTEST_DOLPHIN_HOST:-210.45.79.253}
      BACKTEST_DOLPHIN_PORT: ${BACKTEST_DOLPHIN_PORT:-18902}
      BACKTEST_DOLPHIN_USERNAME: ${BACKTEST_DOLPHIN_USERNAME:?Set BACKTEST_DOLPHIN_USERNAME in .env}
      BACKTEST_DOLPHIN_PASSWORD: ${BACKTEST_DOLPHIN_PASSWORD:?Set BACKTEST_DOLPHIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - home:/home/jovyan
      - ./data:/home/jovyan/work
      - type: volume
        source: skills
        target: /shared/skills
        volume:
          nocopy: true
      - ./skills/backtest:/shared/skills/backtest
      - ./skills/data-query:/shared/skills/data-query
      - ./skills/dolphindb:/shared/skills/dolphindb
      - ./skills/dsl:/shared/skills/dsl
      - ./skills/factor-analysis:/shared/skills/factor-analysis
      - ./codex/skills.json:/opt/jupyter-codex/skills.json:ro
      - ./config:/home/jovyan/.jupyter
      - ./keyring-data:/home/jovyan/.local/share/keyrings
      - codex-home:/home/jovyan/.codex
      - ./config/nbconvert/templates/latex:/home/jovyan/.local/share/jupyter/nbconvert/templates/latex
      - ./ipython_config.py:/etc/ipython/ipython_config.py:ro
      - ./solo_report_bridge.py:/etc/ipython/solo_report_bridge.py:ro

volumes:
  home:
  codex-home:
  skills:

networks:
  default: {}
  default_external:
    external: true
    name: ${SOLO_DOCKER_NETWORK:-}
